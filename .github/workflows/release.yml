name: Release Obsidian plugin

on:
  push:
    tags:
      # Semantic-versioning tags only (e.g. 1.2.3, 1.2.3-beta.1).
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          # The release may already exist: publishing one from the GitHub UI
          # creates the tag too, and that tag push is what started this run.
          # `gh release create` fails on it, leaving a release with no assets —
          # the one outcome worth avoiding, since a plugin release without
          # main.js is useless to Obsidian. Upload onto it instead. --clobber
          # also makes re-running a half-finished job safe.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" \
              --title="$tag" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
