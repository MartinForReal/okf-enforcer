name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Check tracked bundle
        run: git diff --exit-code -- main.js
